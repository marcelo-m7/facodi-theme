name: Odoo 19 Theme CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Theme repository contract
        run: bash tests/test_module_contract.sh

      - name: FACODI homepage dashboard contract
        run: bash tests/test_homepage_dashboard_contract.sh

      - name: FACODI Website Foundation v2 contract
        run: bash tests/test_foundation_v2_contract.sh

      - name: Native Odoo i18n contract
        run: bash tests/test_i18n_contract.sh

      - name: Checkout pinned Odoo design themes
        run: |
          git clone --filter=blob:none https://github.com/odoo/design-themes.git "$RUNNER_TEMP/design-themes"
          git -C "$RUNNER_TEMP/design-themes" checkout a1818df4ade65406c0cacae8b1ea676e6f70095f
          test -f "$RUNNER_TEMP/design-themes/theme_common/__manifest__.py"

      - name: Prepare legacy theme release
        run: |
          LEGACY_SHA="4d384edf2709ff7cad1a432e3391de0673f3b24d"
          git worktree add --detach "$RUNNER_TEMP/facodi-theme-baseline" "$LEGACY_SHA"
          grep -Fq '"version": "19.0.5.0.1"' "$RUNNER_TEMP/facodi-theme-baseline/theme_facodi/__manifest__.py"
          grep -Fq '"version": "19.0.5.0.2"' theme_facodi/__manifest__.py

      - name: Start PostgreSQL 16
        run: |
          docker network create facodi-theme-ci
          docker run -d --name facodi-theme-db \
            --network facodi-theme-ci \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=odoo \
            -e POSTGRES_DB=theme_facodi_ci \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec facodi-theme-db pg_isready -U odoo -d theme_facodi_ci; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install legacy theme release and run Odoo tests
        run: |
          docker run --rm \
            --network facodi-theme-ci \
            -e HOST=facodi-theme-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$RUNNER_TEMP/facodi-theme-baseline:/mnt/facodi-addons:ro" \
            -v facodi-theme-data:/var/lib/odoo \
            -v "$RUNNER_TEMP/design-themes:/mnt/design-themes:ro" \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/design-themes,/mnt/facodi-addons \
            --workers=0 \
            --without-demo=True \
            -d theme_facodi_ci \
            -i theme_facodi \
            --test-tags /theme_facodi \
            --stop-after-init

      - name: Seed persisted legacy course showcase
        run: |
          docker run --rm -i \
            --network facodi-theme-ci \
            -e HOST=facodi-theme-db -e USER=odoo -e PASSWORD=odoo \
            -v "$RUNNER_TEMP/facodi-theme-baseline:/mnt/facodi-addons:ro" \
            -v facodi-theme-data:/var/lib/odoo \
            -v "$RUNNER_TEMP/design-themes:/mnt/design-themes:ro" \
            odoo:19.0 \
            odoo shell \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/design-themes,/mnt/facodi-addons \
            --workers=0 -d theme_facodi_ci \
            < tests/ci_seed_legacy_course_showcase.py

      - name: Upgrade theme and rerun regression tests
        run: |
          docker run --rm \
            --network facodi-theme-ci \
            -e HOST=facodi-theme-db -e USER=odoo -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/facodi-addons:ro" \
            -v facodi-theme-data:/var/lib/odoo \
            -v "$RUNNER_TEMP/design-themes:/mnt/design-themes:ro" \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/design-themes,/mnt/facodi-addons \
            --workers=0 --without-demo=True \
            -d theme_facodi_ci -u theme_facodi \
            --test-tags /theme_facodi --stop-after-init

      - name: Verify legacy course showcase builder repair
        run: |
          docker run --rm -i \
            --network facodi-theme-ci \
            -e HOST=facodi-theme-db -e USER=odoo -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/facodi-addons:ro" \
            -v facodi-theme-data:/var/lib/odoo \
            -v "$RUNNER_TEMP/design-themes:/mnt/design-themes:ro" \
            odoo:19.0 \
            odoo shell \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/design-themes,/mnt/facodi-addons \
            --workers=0 -d theme_facodi_ci \
            < tests/ci_verify_legacy_course_showcase.py

      - name: PostgreSQL logs on failure
        if: failure()
        run: docker logs facodi-theme-db || true
