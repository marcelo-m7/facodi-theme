name: Odoo 19 Theme CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 16
        run: |
          docker network create facodi-theme-ci
          docker run -d --name facodi-theme-db \
            --network facodi-theme-ci \
            -e POSTGRES_USER=odoo \
            -e POSTGRES_PASSWORD=odoo \
            -e POSTGRES_DB=website_facodi_ci \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec facodi-theme-db pg_isready -U odoo -d website_facodi_ci; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install theme and run Odoo tests
        run: |
          docker run --rm \
            --network facodi-theme-ci \
            -e HOST=facodi-theme-db \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            odoo:19.0 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --workers=0 \
            --without-demo=True \
            -d website_facodi_ci \
            -i website_facodi \
            --test-tags /website_facodi \
            --stop-after-init

      - name: PostgreSQL logs on failure
        if: failure()
        run: docker logs facodi-theme-db || true
